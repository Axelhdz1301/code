type: custom:room-summary-card #Tarjeta de vestidor
area: cuarto_01
area_name: Recamara
features:
  - multi_light_background
  - hide_area_stats
  - show_entity_labels
entities:
  - entity_id: switch.cama_01_switch_1
    label: Redondas
  - entity_id: switch.cama_01_switch_2
    label: LED
  - entity_id: switch.cama_01_switch_3
    label: Central
lights:
  - switch.cama_01_switch_1
  - switch.cama_01_switch_2
  - switch.cama_01_switch_3
grid_options:
  columns: 9
  rows: 5
actions:
  tap_action:
    action: perform-action
    perform_action: switch.toggle
    target:
      entity_id:
        - switch.cama_01_switch_1
        - switch.cama_01_switch_2
        - switch.cama_01_switch_3

